name: Deploy Smidr ExampleSite to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'exampleSite/**'
      - 'layouts/**'
      - 'assets/**'
      - 'static/**'
      - 'i18n/**'
      - 'theme.toml'
      - 'README.md'
      - '.github/workflows/deploy-examplesite.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build ExampleSite
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --source exampleSite \
            --themesDir ../.. \
            --baseURL "https://jokobus.github.io/smidr/" \
            --minify \
            --destination ../public
          touch public/.nojekyll

      - name: Deploy to gh-pages Branch (Supports Branch Deployment)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Deploy to GitHub Pages (Supports Actions Deployment)
        id: deployment
        uses: actions/deploy-pages@v4
