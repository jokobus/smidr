baseURL: "https://example.org/"
title: "Smidr"
theme: "smidr"
defaultContentLanguage: "en"
enableRobotsTXT: true

# Enable JSON output for Home page so search.js can fetch /index.json
outputs:
  home:
    - HTML
    - RSS
    - JSON
  page:
    - HTML
  section:
    - HTML
    - RSS
  taxonomy:
    - HTML
  term:
    - HTML

# Multi-language configuration (English & German)
languages:
  en:
    label: "English"
    locale: "en-US"
    weight: 1
    title: "Smidr"
    params:
      description: "A futuristic robotics, machine learning, and engineering logbook."
      subtitle: "Robotics & Machine Learning"
      hero_description: "A futuristic robotics, machine learning, and engineering logbook."
    menus:
      main:
        - name: "Home"
          url: "/"
          weight: 10
        - name: "Blog"
          url: "/posts/"
          weight: 20
        - name: "Publications"
          url: "/publications/"
          weight: 30
        - name: "About & CV"
          url: "/about/"
          weight: 40

  de:
    label: "Deutsch"
    locale: "de-DE"
    weight: 2
    title: "Smidr"
    params:
      description: "Ein futuristisches Logbuch über Robotik, maschinelles Lernen und Ingenieurwesen."
      subtitle: "Robotik & Maschinelles Lernen"
      hero_description: "Ein futuristisches Logbuch über Robotik, maschinelles Lernen und Ingenieurwesen."
    menus:
      main:
        - name: "Start"
          url: "/de/"
          weight: 10
        - name: "Blog"
          url: "/de/posts/"
          weight: 20
        - name: "Publikationen"
          url: "/de/publications/"
          weight: 30
        - name: "Über mich & CV"
          url: "/de/about/"
          weight: 40

params:
  since: 2024
  author:
    name: "Smidr Engineer"
    email: "contact@example.org"
  math: true

  # Color Palette & Farbverlauf (Gradient) Configuration
  # Supported palettes: "magenta-violet" (default/recommended), "cyber", "neon", "aurora", "sunset", "minimal"
  palette: "magenta-violet"

  # Farbverlauf toggle:
  # true  = with "Farbverlauf" (gradient buttons, glowing action triggers, and brand title gradient)
  # false = without "Farbverlauf" (clean, solid modern styling with solid colors and no gradients)
  gradient: true

  # Bibliography & Citation Configuration
  citation_style: "numeric" # Default citation style: "numeric", "author-year", or "alphabetic"
  bib_auto_load: true       # Automatically load any .bib file alongside the .md content file
  bib_show_all: false       # Default to showing cited references (false) or entire library (true)
  
  # Umami Analytics Configuration (Zero Google Trackers)
  umami:
    websiteId: "your-umami-website-id-here"
    hostUrl: "https://cloud.umami.is"

  # Optional Privacy-Friendly Advertisement / Sponsorship Slot
  ad:
    enabled: false
    badge: "SPONSOR"
    disclaimer: "Support open robotics research"
    title: "Autonomous Robotics Lab"
    text: "Open-source motion planning and neural control tools for agile mobile manipulators."
    button: "Learn More →"
    link: "https://github.com/sponsors"

  # Optional Giscus GitHub Discussions Comments
  giscus:
    enable: false
    repo: "your-username/your-repo"
    repoId: "R_kgDO..."
    category: "Announcements"
    categoryId: "DIC_kwDO..."
    mapping: "pathname"
    reactionsEnabled: "1"
    inputPosition: "bottom"

# Goldmark Markdown configuration
markup:
  goldmark:
    renderer:
      unsafe: true # Allows custom HTML inside shortcodes
  highlight:
    noClasses: false
    style: "dracula"
