{{- $lang := .lang | default "python" -}}
{{- $title := .title | default (printf "Interactive %s Sandbox (Browser WASM)" ($lang | upper)) -}}
{{- $code := .code | default "" -}}

<div class="code-runner-box" data-lang="{{ $lang }}">
  <div class="runner-header">
    <div class="code-lang-badge">
      <span>🔨</span>
      <span>{{ $title }}</span>
    </div>
    <div class="runner-actions">
      <button class="code-copy-btn runner-btn-copy" type="button" aria-label="Copy code to clipboard">
        <span>📋</span>
        <span class="copy-text">Copy</span>
      </button>
      <button class="code-copy-btn runner-btn-clear" type="button" aria-label="Clear output">
        <span>🗑️</span>
        <span>Clear</span>
      </button>
      <button class="runner-btn-run" type="button" aria-label="Execute code in browser">
        <span>▶</span>
        <span>Run</span>
      </button>
    </div>
  </div>
  <div class="runner-editor-area">
    <div class="runner-line-numbers" aria-hidden="true"></div>
    <textarea class="runner-textarea" spellcheck="false" aria-label="Editable Code Area">{{ $code | chomp }}</textarea>
    <button class="runner-btn-fullscreen" type="button" aria-label="Toggle Fullscreen" title="Toggle Fullscreen">
      <svg class="fullscreen-icon-expand" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 3 21 3 21 9"></polyline>
        <polyline points="9 21 3 21 3 15"></polyline>
        <line x1="21" y1="3" x2="14" y2="10"></line>
        <line x1="3" y1="21" x2="10" y2="14"></line>
      </svg>
      <svg class="fullscreen-icon-compress" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
        <polyline points="4 14 10 14 10 20"></polyline>
        <polyline points="20 10 14 10 14 4"></polyline>
        <line x1="14" y1="10" x2="21" y2="3"></line>
        <line x1="3" y1="21" x2="10" y2="14"></line>
      </svg>
    </button>
  </div>
  <div class="runner-output-area" aria-live="polite">
    <div class="runner-output-title">Terminal Output</div>
    <pre class="runner-stdout"></pre>
    <pre class="runner-stderr"></pre>
  </div>
</div>
