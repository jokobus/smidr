{{- $title := .Get "title" | default "References" -}}
{{- $content := .Inner -}}
{{- with .Get "file" -}}
  {{- $content = readFile . -}}
{{- end -}}
{{- $id := printf "bib-sec-%d" (now.UnixNano) -}}

<section class="smidr-bibliography-section" id="{{ $id }}" aria-label="{{ $title }}">
  <h2 class="bib-section-title">
    <span>📚</span> <span>{{ $title }}</span>
  </h2>
  <div class="smidr-bibliography">
    <script type="text/bibtex" class="bibtex-source">
{{ $content | safeJS }}
    </script>
    <ol class="bib-entries-list">
      <!-- Formatted references and copy buttons generated by bibtex.js -->
    </ol>
  </div>
</section>
